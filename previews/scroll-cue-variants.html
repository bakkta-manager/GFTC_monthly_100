<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스크롤 안내 시안 4종</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--gold:#ffd84d}
  *{box-sizing:border-box}
  body{margin:0;background:#fafbff;color:#fff;font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
  .grid4{display:grid;grid-template-columns:repeat(2,1fr)}
  @media (max-width:760px){.grid4{grid-template-columns:1fr}}
  .panel{position:relative;min-height:360px;display:flex;align-items:center;justify-content:center;background:linear-gradient(#0a4ba1 0%,#0b1d36 100%);border:1px solid rgba(255,255,255,.08)}
  .panel .g{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:64px 64px}
  .tag{position:absolute;left:16px;top:16px;padding:6px 12px;border-radius:999px;background:#fff;color:#0b1d36;font-size:13px;font-weight:800;letter-spacing:.08em}
  .cue{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;color:rgba(255,255,255,.85);text-decoration:none}
  .cue small{font-size:12px;letter-spacing:.2em;font-weight:600}

  /* A. 셰브론 바운스 */
  .a .chev{width:22px;height:22px;border-right:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(45deg);animation:bounce 1.6s ease-in-out infinite}
  .a .chev+.chev{margin-top:-14px;opacity:.5;animation-delay:.15s}
  @keyframes bounce{0%,100%{transform:translateY(0) rotate(45deg);opacity:.9}50%{transform:translateY(8px) rotate(45deg);opacity:.4}}

  /* B. 마우스 휠 */
  .b .mouse{width:26px;height:42px;border:2px solid rgba(255,255,255,.8);border-radius:14px;position:relative}
  .b .mouse::before{content:"";position:absolute;left:50%;top:8px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:var(--gold);animation:wheel 1.8s ease-in-out infinite}
  @keyframes wheel{0%{transform:translateY(0);opacity:1}70%{transform:translateY(14px);opacity:0}100%{transform:translateY(0);opacity:0}}

  /* C. 흐르는 선 */
  .c .line{width:1px;height:56px;background:rgba(255,255,255,.2);position:relative;overflow:hidden}
  .c .line::after{content:"";position:absolute;left:0;top:-100%;width:100%;height:100%;background:linear-gradient(transparent,#fff);animation:drip 1.8s cubic-bezier(.4,0,.2,1) infinite}
  @keyframes drip{to{top:100%}}

  /* D. 원형 버튼 + 링 */
  .d .btn{position:relative;width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.5);display:grid;place-content:center;background:rgba(255,255,255,.06)}
  .d .btn::before{content:"";position:absolute;inset:-1px;border-radius:50%;border:1px solid rgba(255,216,77,.9);animation:ring 2s ease-out infinite}
  .d .btn svg{animation:nudge 1.6s ease-in-out infinite}
  @keyframes ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.7);opacity:0}}
  @keyframes nudge{0%,100%{transform:translateY(-2px)}50%{transform:translateY(3px)}}

  @media (prefers-reduced-motion:reduce){.a .chev,.b .mouse::before,.c .line::after,.d .btn::before,.d .btn svg{animation:none}.c .line::after{top:0}}
</style>
</head>
<body>
<div class="grid4">
  <div class="panel"><div class="g"></div><span class="tag">시안 A · 셰브론</span>
    <a class="cue a" href="#"><small>SCROLL</small><span class="chev"></span><span class="chev"></span></a>
  </div>
  <div class="panel"><div class="g"></div><span class="tag">시안 B · 마우스</span>
    <a class="cue b" href="#"><span class="mouse"></span><small>SCROLL</small></a>
  </div>
  <div class="panel"><div class="g"></div><span class="tag">시안 C · 흐르는 선</span>
    <a class="cue c" href="#"><small>아래로 스크롤</small><span class="line"></span></a>
  </div>
  <div class="panel"><div class="g"></div><span class="tag">시안 D · 원형 버튼</span>
    <a class="cue d" href="#"><span class="btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg></span><small>SCROLL</small></a>
  </div>
</div>
</body>
</html>
